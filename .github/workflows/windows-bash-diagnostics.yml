name: Windows Bash input diagnostics

on:
  push:
    branches: [diagnostics/bash-input-20261021]

permissions:
  contents: read

jobs:
  bash-input:
    name: Bash diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      NEBULA_BOOT_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record native environment
        shell: pwsh
        run: ./.github/windows-bash-environment.ps1 in-box
      - name: Compile the original regression with diagnostic scan variants
        id: compile
        shell: pwsh
        run: |
          $arguments = @('test', '--config', '.github/ci-profile.toml', '--profile', 'ci', '--locked', '-p', 'nebula_terminal', '--lib', '--no-run', '--message-format=json-render-diagnostics')
          (@('cargo') + $arguments) | ConvertTo-Json | Set-Content -Encoding utf8 target/bash-diagnostics/compile-command.json
          cargo @arguments > target/bash-diagnostics/cargo-messages.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic compilation failed.' }
      - name: Compare scan-code arms on in-box ConPTY
        shell: pwsh
        run: python .github/windows-bash-stress.py in-box --repetitions 48 --workers 4
      - name: Prepare the pinned side-loaded host beside the test binary
        id: runtime
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: pwsh
        run: |
          $architecture = if ('${{ runner.arch }}' -eq 'ARM64') { 'arm64' } else { 'x64' }
          ./scripts/prepare-windows-runtime.ps1 -Destination target/ci/deps/runtime -Architecture $architecture
          ./.github/windows-bash-environment.ps1 sideloaded
      - name: Compare scan-code arms on side-loaded OpenConsole
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: pwsh
        run: python .github/windows-bash-stress.py sideloaded --repetitions 48 --workers 4
      - name: Preserve original results and environment
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-bash-${{ matrix.os }}-${{ github.sha }}
          path: target/bash-diagnostics/
          if-no-files-found: error
          retention-days: 7
