name: Windows Bash input diagnostics

on:
  push:
    branches: [diagnostics/bash-input-20261021]

permissions:
  contents: read

jobs:
  bash-input:
    name: Bash diagnostic (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      CARGO_INCREMENTAL: "0"
      NEBULA_BOOT_TRACE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - name: Record native environment
        shell: pwsh
        run: |
          rustc -vV
          [Environment]::OSVersion.VersionString
          & 'C:\Program Files\Git\bin\bash.exe' --version
          if ('${{ matrix.os }}' -eq 'windows-11-arm') {
            if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne 'Arm64') {
              throw 'The ARM64 diagnostic requires a native ARM64 host.'
            }
            $compiler = rustc -vV
            if ($compiler -notcontains 'host: aarch64-pc-windows-msvc') {
              throw 'The ARM64 diagnostic requires a native ARM64 compiler.'
            }
          }
      - name: Compile the unchanged regression
        shell: pwsh
        run: |
          cargo test --config .github/ci-profile.toml --profile ci --locked -p nebula_terminal --lib --no-run
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic compilation failed.' }
      - name: Stress in-box ConPTY
        shell: pwsh
        run: python .github/windows-bash-stress.py in-box
      - name: Prepare the pinned side-loaded host beside the test binary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $architecture = if ('${{ runner.arch }}' -eq 'ARM64') { 'arm64' } else { 'x64' }
          ./scripts/prepare-windows-runtime.ps1 -Destination target/ci/deps/runtime -Architecture $architecture
      - name: Stress side-loaded OpenConsole
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python .github/windows-bash-stress.py sideloaded
